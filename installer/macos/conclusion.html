<h2>VRC Bot Blocker is installed</h2>
<p>From now on VRCX blocks these bots as soon as they join. The <b>Bot Blocker</b> entry in VRCX's
side menu manages your list of blocked groups.</p>
<p>To remove it later, double-click <b>Uninstall VRCX Bot Blocker</b> in
<code>~/Library/Application Support/VRCX Bot Blocker</code>.</p>
